name: Sync GitHub => Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  push-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install git-lfs
          git lfs install

      - name: Download LFS content (images)
        run: git lfs pull

      - name: Set up Git
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://huggingface.co/spaces/tabodino/divia-transport-planner hf_space
          rsync -av --delete . hf_space/ --exclude=hf_space --exclude=.git --exclude=.github
          cd hf_space
          git add .
          git commit -m "Sync from GitHub ($GITHUB_SHA)" || echo "No changes to commit"
          git push https://hf_user:${HF_TOKEN}@huggingface.co/spaces/tabodino/divia-transport-planner main
